name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: astrbot_plugin_mhcodes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install -r astrbot_plugin_mhcodes/requirements-dev.txt
      - name: Verify release tag matches metadata
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: astrbot_plugin_mhcodes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          version = yaml.safe_load(Path('metadata.yaml').read_text())['version']
          expected = 'v' + str(version).removeprefix('v')
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}')
          PY
      - name: Check code and run tests
        working-directory: astrbot_plugin_mhcodes
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q
          python scripts/build_package.py
      - name: Upload plugin installation package
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: astrbot_plugin_mhcodes/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  astrbot-api:
    name: AstrBot API (${{ matrix.astrbot }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        astrbot: ['astrbot==4.16.0', 'astrbot>=4.16,<5']
    steps:
      - uses: actions/checkout@v6
        with:
          path: astrbot_plugin_mhcodes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AstrBot
        env:
          ASTRBOT_SPEC: ${{ matrix.astrbot }}
        run: python -m pip install "$ASTRBOT_SPEC" -r astrbot_plugin_mhcodes/requirements.txt
      - name: Report installed AstrBot version
        run: python -c "from importlib.metadata import version; print('AstrBot', version('astrbot'))"
      - name: Run real API smoke check (no QQ connection)
        run: python astrbot_plugin_mhcodes/scripts/smoke_astrbot.py
      - name: Run real loader and waking pipeline checks (no QQ connection)
        run: python astrbot_plugin_mhcodes/scripts/smoke_lifecycle.py

  release:
    name: Publish release package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality, astrbot-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release notes from commits
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: .github/cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: dist
      - name: Create release and upload installation package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
            gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
